<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Overlay - Multi PK (MCA Standard)</title>

<!-- ============================================ -->
<!-- CSS GỐC CỦA MCASTAR (Giữ nguyên từ file bạn gửi) -->
<!-- ============================================ -->
<style>
  @font-face{font-family:'SF Pro Text';font-style:normal;font-weight:400;font-display:swap;src:url(//static.mcastar.net/live_assistant/fonts/sf-pro-text_regular.woff2) format("woff2")}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent !important;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'SF Pro Text', 'PingFangSC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  }

  :root {
    --radius-s: 4px;
    --radius-m: 8px;
    --radius-l: 12px;
    --multipk-color-1: rgba(255, 86, 176, 1);
    --multipk-color-2: rgba(3, 190, 242, 1);
    --multipk-color-3: rgba(255, 172, 62, 1);
    --multipk-color-4: rgba(150, 75, 250, 1);
    --multipk-color-5: rgba(255, 53, 66, 1);
    --multipk-color-1-rgb: 255, 86, 176;
    --multipk-color-2-rgb: 3, 190, 242;
    --multipk-color-3-rgb: 255, 172, 62;
    --multipk-color-4-rgb: 150, 75, 250;
    --multipk-color-5-rgb: 255, 53, 66;
  }

  #app { display: flex; justify-content: center; align-items: center; }
  .widget-multipk-container { position: relative; width: 360px; }

  /* === 1. HÀNG AVATAR + TÊN === */
  .widget-multipk-anchor-info {
    position: relative;
    display: flex;
    width: 100%;
    margin-bottom: 4px;
  }
  .widget-multipk-anchor-info .anchor-column {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    border-radius: 6px;
    height: 20px;
  }
  .widget-multipk-anchor-info .anchor-column .avatar-container {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    z-index: 2;
  }
  .widget-multipk-anchor-info .anchor-column .avatar-container .avatar {
    width: 18px;
    height: 18px;
    border: 0.9px solid rgba(0,0,0,0.4);
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #444;
  }
  .widget-multipk-anchor-info .anchor-column .avatar-container .position-1-avatar { border-color: var(--multipk-color-1); }
  .widget-multipk-anchor-info .anchor-column .avatar-container .position-2-avatar { border-color: var(--multipk-color-2); }
  .widget-multipk-anchor-info .anchor-column .avatar-container .position-3-avatar { border-color: var(--multipk-color-3); }
  .widget-multipk-anchor-info .anchor-column .avatar-container .position-4-avatar { border-color: var(--multipk-color-4); }
  .widget-multipk-anchor-info .anchor-column .avatar-container .position-5-avatar { border-color: var(--multipk-color-5); }

  .widget-multipk-anchor-info .anchor-column .win-label {
    position: absolute;
    bottom: -1.5px;
    left: -3px;
    width: 19px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(125.76deg, #fff 11.7%, #ffdf67 64.37%, #ffb60f 83.15%, #ff9b00 100%);
    box-shadow: 0px 0px 2.2px #fff4ad inset;
    color: rgba(0,0,0,0.8);
    font-size: 4px;
    font-weight: 700;
    display: flex;
    align-items: center;
    text-align: center;
    justify-content: center;
  }
  .widget-multipk-anchor-info .anchor-column .nickname-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 50px;
    height: 14px;
    border-radius: 6px;
  }
  .widget-multipk-anchor-info .anchor-column .nickname-container.avatar-display {
    margin-left: -8px;
  }
  .widget-multipk-anchor-info .anchor-column .nickname-container .nickname {
    color: #fff;
    font-weight: 600;
    font-size: 8px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .widget-multipk-anchor-info .anchor-column .nickname-container.position-1-nickname { background: var(--multipk-color-1); }
  .widget-multipk-anchor-info .anchor-column .nickname-container.position-2-nickname { background: var(--multipk-color-2); }
  .widget-multipk-anchor-info .anchor-column .nickname-container.position-3-nickname { background: var(--multipk-color-3); }
  .widget-multipk-anchor-info .anchor-column .nickname-container.position-4-nickname { background: var(--multipk-color-4); }
  .widget-multipk-anchor-info .anchor-column .nickname-container.position-5-nickname { background: var(--multipk-color-5); }

  /* === 2. THANH BAR === */
  .widget-multipk-bar {
    position: relative;
    width: 100%;
    height: 16px;
    border-radius: var(--radius-m);
    overflow: hidden;
    background: rgba(0,0,0,0.3);
  }
  .widget-multipk-bar .bar-container {
    display: flex;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .widget-multipk-bar .position-part {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .widget-multipk-bar .position-part .score {
    position: absolute;
    left: 4px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .widget-multipk-bar .position-part.position-1 { background-image: linear-gradient(90deg, var(--multipk-color-1), rgba(var(--multipk-color-1-rgb), 0.9)); }
  .widget-multipk-bar .position-part.position-2 { background-image: linear-gradient(90deg, var(--multipk-color-2), rgba(var(--multipk-color-2-rgb), 0.9)); }
  .widget-multipk-bar .position-part.position-3 { background-image: linear-gradient(90deg, var(--multipk-color-3), rgba(var(--multipk-color-3-rgb), 0.9)); }
  .widget-multipk-bar .position-part.position-4 { background-image: linear-gradient(90deg, var(--multipk-color-4), rgba(var(--multipk-color-4-rgb), 0.9)); }
  .widget-multipk-bar .position-part.position-5 { background-image: linear-gradient(90deg, var(--multipk-color-5), rgba(var(--multipk-color-5-rgb), 0.9)); }
  
  .widget-multipk-bar .position-part:first-child { border-top-left-radius: var(--radius-m); border-bottom-left-radius: var(--radius-m); }
  .widget-multipk-bar .position-part:last-child { border-top-right-radius: var(--radius-m); border-bottom-right-radius: var(--radius-m); }

  .widget-multipk-bar-separator {
    height: 16px;
    background: #fff;
    box-shadow: 0px 0px 2px 0.5px rgba(255,255,255,0.2);
    z-index: 11;
    pointer-events: none;
    flex-shrink: 0;
    border-right: 2px solid #fff;
    width: 0;
  }

  /* HIỆU ỨNG ÁNH SÁNG CỦA MCA (Dùng background-image PNG) */
  .widget-multipk-bar-effect {
    position: absolute;
    top: 50%;
    right: -23px;
    width: 90px;
    height: 16px;
    background-image: url("https://static.mcastar.net/live_assistant/image/widget_animate_multipk.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transform: translateY(-50%);
    opacity: 1;
    z-index: 10;
    pointer-events: none;
  }
  .widget-multipk-bar-effect.last-position {
    right: auto;
    left: -23px;
    transform: translateY(-50%) scaleX(-1);
  }

  /* === 3. HÀNG TOP GIFTERS === */
  .widget-multipk-gift-info {
    position: relative;
    margin-top: 4px;
    display: flex;
    width: 100%;
  }
  .widget-multipk-gift-info .gifts-column {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    margin-left: 1px;
  }
  .widget-multipk-gift-info .gift-container {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 51px;
    height: 19px;
    gap: 2px;
  }
  .widget-multipk-gift-info .gift-container .gift-icons-wrapper {
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 27.59%, rgba(102,102,102,0.25) 105.36%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5px;
    padding: 1px 1px;
  }
  .widget-multipk-gift-info .gift-container .gift-icons-wrapper .gift-icon {
    width: 20px;
    height: 20px;
    object-fit: contain;
  }
  .widget-multipk-gift-info .gift-container .user-avatars {
    display: flex;
    align-items: center;
  }
  .widget-multipk-gift-info .gift-container .user-avatars img {
    width: 18px;
    height: 18px;
    border-radius: 50% !important;
    border: 0.5px solid #f6d346;
    box-sizing: border-box;
    background: #d9d9d9;
    object-fit: cover;
    display: inline-block;
  }
  .widget-multipk-gift-info .gift-container .user-avatars img:not(:first-child) {
    margin-left: -8px;
  }

  /* === 4. TIMER === */
  .widget-multipk-bottom {
    position: relative;
    margin-top: 11px;
    width: 100%;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .widget-multipk-bottom-count {
    min-width: 70px;
    height: 24px;
    padding: 0 10px;
    border-radius: 13px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
    transition: background 0.3s ease;
  }
  .widget-multipk-bottom-count.urgent {
    animation: timerUrgentFlash 0.6s ease-in-out infinite alternate;
  }

  /* === ANIMATIONS === */

  /* Bar width transition mượt */
  .widget-multipk-bar .position-part {
    transition: width 0.5s ease-out;
  }
  .widget-multipk-anchor-info .anchor-column {
    transition: width 0.5s ease-out;
  }
  .widget-multipk-gift-info .gifts-column {
    transition: width 0.5s ease-out;
  }

</style>
</head>
<body>

<div id="app">
  <div class="widget" style="transform: scale(2.3);">
    <div class="widget-multipk-container">
      
      <!-- 1. Hàng Avatar + Tên -->
      <div class="widget-multipk-anchor-info" id="anchor-row"></div>

      <!-- 2. Thanh Bar + Hiệu ứng ánh sáng -->
      <div class="widget-multipk-bar">
        <div class="bar-container" id="pk-bar-container"></div>
      </div>

      <!-- 3. Hàng Top Gifters -->
      <div class="widget-multipk-gift-info" id="gift-row"></div>

      <!-- 4. Timer only -->
      <div class="widget-multipk-bottom" style="width: 100%;">
        <div class="widget-multipk-bottom-count" id="pk-timer-box">
          <span id="pk-timer">Stand by</span>
        </div>
      </div>



    </div>
  </div>
</div>

<script>
let state = null;

function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

// Tạo avatar mặc định nếu không có link
function getAvatarUrl(idol) {
  if (idol.avatar && idol.avatar.trim()) return idol.avatar;
  const initial = (idol.name || "?").trim().slice(0, 2).toUpperCase();
  const canvas = document.createElement("canvas");
  canvas.width = 40; canvas.height = 40;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#3a3a46";
  ctx.fillRect(0, 0, 40, 40);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(initial, 20, 20);
  return canvas.toDataURL();
}

function render() {
  if (!state) return;
  // ── Đọc đúng cấu trúc server: state.pk.positions[] ──
  const pk    = state.pk    || { num_positions: 3, round: 1, status: "standby", positions: [] };
  const timer = state.timer || { duration: 120, remaining: 120, running: false, finished: false };

  // Build mảng vị trí từ pk.positions (server trả về [{id,name,avatar,score,gift_id,gift_img}])
  const n = pk.num_positions || 3;
  const positions = [];
  for (let i = 0; i < n; i++) {
    const p = (pk.positions && pk.positions[i]) || {};
    positions.push({
      name:     p.name     || `Vị trí ${i + 1}`,
      avatar:   p.avatar   || "",
      score:    Number(p.score) || 0,
      gift_img: p.gift_img || "",
    });
  }

  const totalScore = positions.reduce((s, p) => s + Math.max(0, p.score), 0);
  const maxScore   = Math.max(...positions.map(p => p.score), 0);

  /*
   * MCA-style balanced PK bar:
   * - Every player gets a guaranteed minimum width.
   * - Only the remaining space is distributed by score.
   * - Therefore a player can never be squeezed to 0px or hidden,
   *   even when another player has an enormous score.
   */
  const BAR_PX = 360;
  const SEPARATOR_PX = 2;
  const usablePx = BAR_PX - Math.max(0, n - 1) * SEPARATOR_PX;

  // Close to the proportions used by MCA:
  // 3 players ≈ 65px minimum each, then score gets the remainder.
  // For 4/5 players the minimum scales down so everybody remains visible.
  const minPxByCount = {2: 80, 3: 65, 4: 52, 5: 42};
  const minPx = minPxByCount[n] || Math.max(34, Math.floor(usablePx / n * 0.18));
  const basePx = Math.min(minPx, Math.floor(usablePx / n));
  const extraPx = Math.max(0, usablePx - basePx * n);

  function widthPx(score) {
    if (totalScore <= 0) return usablePx / n;
    return basePx + extraPx * (Math.max(0, score) / totalScore);
  }

  function widthPct(score) {
    return (widthPx(score) / BAR_PX) * 100;
  }

  // 1. Render Hàng Avatar + Tên — giữ DOM, chỉ update width
  const anchorRow = document.getElementById("anchor-row");
  const anchorCols = anchorRow.querySelectorAll(".anchor-column");
  if (anchorCols.length !== n) {
    // Số người thay đổi → rebuild
    anchorRow.innerHTML = "";
    positions.forEach((pos, idx) => {
      const posNum = idx + 1;
      const col = document.createElement("div");
      col.className = "anchor-column";
      col.style.width = widthPct(pos.score) + "%";
      col.innerHTML = `
        <div class="avatar-container">
          <img class="avatar position-${posNum}-avatar" src="${getAvatarUrl(pos)}">
        </div>
        <div class="nickname-container avatar-display position-${posNum}-nickname">
          <span class="nickname">${pos.name}</span>
        </div>
      `;
      anchorRow.appendChild(col);
    });
  } else {
    // Update width + avatar + tên → không cần reload khi thay người
    positions.forEach((pos, idx) => {
      const col = anchorCols[idx];
      const newW = widthPct(pos.score) + "%";
      if (col.style.width !== newW) {
        requestAnimationFrame(() => { col.style.width = newW; });
      }
      const avatarEl = col.querySelector(".avatar");
      const newSrc = getAvatarUrl(pos);
      if (avatarEl && avatarEl.src !== newSrc) avatarEl.src = newSrc;
      const nicknameEl = col.querySelector(".nickname");
      if (nicknameEl && nicknameEl.textContent !== pos.name) nicknameEl.textContent = pos.name;
    });
  }

  // 2. Render Thanh Bar — giữ DOM, chỉ update width + score text
  const pkBarContainer = document.getElementById("pk-bar-container");
  const existingParts = pkBarContainer.querySelectorAll(".position-part");
  if (existingParts.length !== n) {
    // Số người thay đổi → rebuild
    pkBarContainer.innerHTML = "";
    positions.forEach((pos, idx) => {
      const posNum    = idx + 1;
      const isLeading = pos.score === maxScore && maxScore > 0;
      const part      = document.createElement("div");
      part.className  = `position-part position-${posNum}`;
      part.style.width = widthPct(pos.score) + "%";
      const scoreText = isLeading ? `No.1(${pos.score.toLocaleString()})` : pos.score.toLocaleString();
      part.innerHTML = `<span class="score position-${posNum}-score score-left-aligned">${scoreText}</span>`;
      if (isLeading) {
        const effect = document.createElement("div");
        effect.className = `widget-multipk-bar-effect${idx === n - 1 ? ' last-position' : ''}`;
        part.appendChild(effect);
      }
      pkBarContainer.appendChild(part);
      if (idx < n - 1) {
        const sep = document.createElement("div");
        sep.className = "widget-multipk-bar-separator";
        pkBarContainer.appendChild(sep);
      }
    });
  } else {
    // Chỉ update width + score text → transition chạy mượt
    positions.forEach((pos, idx) => {
      const isLeading = pos.score === maxScore && maxScore > 0;
      const part = existingParts[idx];
      const newW = widthPct(pos.score) + "%";
      if (part.style.width !== newW) {
        requestAnimationFrame(() => {
          part.style.width = newW;
        });
      }
      const scoreEl = part.querySelector(".score");
      const scoreText = isLeading ? `No.1(${pos.score.toLocaleString()})` : pos.score.toLocaleString();
      scoreEl.textContent = scoreText;
      // Cập nhật hiệu ứng sáng leading
      let effect = part.querySelector(".widget-multipk-bar-effect");
      if (isLeading && !effect) {
        effect = document.createElement("div");
        effect.className = `widget-multipk-bar-effect${idx === n - 1 ? ' last-position' : ''}`;
        part.appendChild(effect);
      } else if (!isLeading && effect) {
        effect.remove();
      }
    });
  }

  // 3. Render Top Gifters — giữ DOM, chỉ update width
  const giftRow = document.getElementById("gift-row");
  const existingGCols = giftRow.querySelectorAll(".gifts-column");
  if (existingGCols.length !== n) {
    giftRow.innerHTML = "";
    positions.forEach((pos, idx) => {
      const gCol = document.createElement("div");
      gCol.className = "gifts-column";
      gCol.style.width = widthPct(pos.score) + "%";
      gCol.innerHTML = `
        <div class="gift-container">
          <div class="gift-icons-wrapper">
            ${pos.gift_img ? `<img src="${pos.gift_img}" alt="gift" class="gift-icon gift-0">` : ''}
          </div>
          <div class="user-avatars"></div>
        </div>
      `;
      giftRow.appendChild(gCol);
    });
  } else {
    positions.forEach((pos, idx) => {
      const gCol = existingGCols[idx];
      const newW = widthPct(pos.score) + "%";
      if (gCol.style.width !== newW) {
        requestAnimationFrame(() => { gCol.style.width = newW; });
      }
      // Cập nhật gift icon khi thay người
      const wrapper = gCol.querySelector(".gift-icons-wrapper");
      if (wrapper) {
        let giftImg = wrapper.querySelector(".gift-icon");
        if (pos.gift_img) {
          if (!giftImg) {
            giftImg = document.createElement("img");
            giftImg.className = "gift-icon gift-0";
            wrapper.appendChild(giftImg);
          }
          if (giftImg.src !== pos.gift_img) giftImg.src = pos.gift_img;
        } else if (giftImg) {
          giftImg.remove();
        }
      }
    });
  }

  // 4. Bottom Info
  const timerBox = document.getElementById("pk-timer-box");
  const timerEl  = document.getElementById("pk-timer");
  timerBox.classList.remove("urgent");

  if (timer.finished) {
    timerEl.textContent = "Finish";
  } else if (!timer.running && timer.remaining === timer.duration) {
    timerEl.textContent = "Stand by";
  } else {
    timerEl.textContent = fmtTime(timer.remaining);
    // Chỉ hiển thị timer nhỏ ở phía dưới; không hiển thị countdown lớn giữa overlay.
    if (timer.running && timer.remaining <= 10 && timer.remaining >= 0) {
      timerBox.classList.add("urgent");
    }
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") {
        state = msg.data;
        render();
      }
    } catch (e) { console.error(e); }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

connect();
</script>
</body>
</html>
